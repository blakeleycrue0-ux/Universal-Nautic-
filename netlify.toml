# Build de Astro → dist/. Netlify detecta los formularios (data-netlify) en el HTML generado.
[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # SITE_URL = "https://www.tu-dominio.es"   ← dominio definitivo (canonical, sitemap, Open Graph)
  # PUBLIC_INDEXABLE = "true"                 ← activar SOLO en el lanzamiento
  # PUBLIC_PLAUSIBLE_DOMAIN / PUBLIC_GA4_ID   ← medición (ver docs/fase-4-seo-analitica-lanzamiento.md)

# Las vistas previas de ramas nunca se indexan.
[context.deploy-preview.environment]
  PUBLIC_INDEXABLE = "false"
[context.branch-deploy.environment]
  PUBLIC_INDEXABLE = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
