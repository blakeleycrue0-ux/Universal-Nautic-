<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Plate renderer (dev tool)</title>
<style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { ReliefRenderer } from '/src/gl/relief.ts'
  import { PLATES, HERO_SHOT } from '/src/gl/shots.ts'
  const canvas = document.getElementById('c')
  const r = new ReliefRenderer(canvas, { preserve: true })
  r.shadowSteps = 12
  window.renderPlate = (name, w, h) => {
    const shot = name === 'hero' ? HERO_SHOT : PLATES[name]
    canvas.width = w; canvas.height = h
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px'
    r.render({ ...shot, grain: 0.02 }, 0.37)
    return canvas.toDataURL('image/png')
  }
  window.ready = true
</script>
</body>
</html>
